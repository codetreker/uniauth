name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ vars.REGISTRY }}/default/uniauth@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_API_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY }}/default/uniauth:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Set release image
        env:
          UNIAUTH_IMAGE: ${{ needs.build.outputs.image }}
        run: sed -i -e "s|__IMAGE__|$UNIAUTH_IMAGE|" -e 's|__ENVIRONMENT__|staging|' deploy/docker-compose.yml
      - name: Copy Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          source: deploy/docker-compose.yml
          strip_components: 1
          target: ${{ vars.DEPLOY_PATH }}
      - name: Start services
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          envs: DEPLOY_PATH
          script: cd "$DEPLOY_PATH" && docker compose up -d

  prod:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - name: Set release image
        env:
          UNIAUTH_IMAGE: ${{ needs.build.outputs.image }}
        run: sed -i -e "s|__IMAGE__|$UNIAUTH_IMAGE|" -e 's|__ENVIRONMENT__|prod|' deploy/docker-compose.yml
      - name: Copy Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          source: deploy/docker-compose.yml
          strip_components: 1
          target: ${{ vars.DEPLOY_PATH }}
      - name: Start services
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          envs: DEPLOY_PATH
          script: cd "$DEPLOY_PATH" && docker compose up -d
