name: Release
run-name: 'Release #${{ github.run_number }} · staging → prod · ${{ github.ref_name }} · @${{ github.actor }} · ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Set image reference
        id: image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-image.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify public image
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.tmp/ghcr-anonymous
          IMAGE: ${{ steps.image.outputs.reference }}
        run: docker pull "$IMAGE"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Set release image
        env:
          UNIAUTH_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          sed -i -e "s|__IMAGE__|$UNIAUTH_IMAGE|" -e 's|__ENVIRONMENT__|staging|' -e 's|container_name: uniauth$|container_name: uniauth-staging|' deploy/docker-compose.yml
      - name: Copy Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          source: deploy/docker-compose.yml
          strip_components: 1
          target: ${{ vars.DEPLOY_PATH }}
      - name: Start services
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          envs: DEPLOY_PATH
          script: cd "$DEPLOY_PATH" && docker compose up -d

  prod:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - name: Set release image
        env:
          UNIAUTH_IMAGE: ${{ needs.build.outputs.image }}
        run: sed -i -e "s|__IMAGE__|$UNIAUTH_IMAGE|" -e 's|__ENVIRONMENT__|prod|' deploy/docker-compose.yml
      - name: Copy Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          source: deploy/docker-compose.yml
          strip_components: 1
          target: ${{ vars.DEPLOY_PATH }}
      - name: Start services
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.OC_VM_HOST }}
          username: ${{ vars.OC_VM_USER }}
          key: ${{ secrets.OC_VM_SSH_KEY }}
          envs: DEPLOY_PATH
          script: cd "$DEPLOY_PATH" && docker compose up -d
