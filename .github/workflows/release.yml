name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make setup
      - run: make build check test
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/browsers
      - run: pnpm test:browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/browsers
      - name: Select image
        id: image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          : "${REGISTRY:?REGISTRY must be set}"
          printf 'name=%s/default/uniauth\n' "$REGISTRY" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Test container and persistent state
        run: |
          docker build --tag uniauth-release-test:local .
          bash scripts/test-release.sh uniauth-release-test:local
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_API_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      revision: ${{ needs.build.outputs.revision }}
    secrets: inherit

  prod:
    needs: [build, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ${{ needs.build.outputs.image }}
      revision: ${{ needs.build.outputs.revision }}
    secrets: inherit
