services:
  uniauth:
    image: ${UNIAUTH_IMAGE:?UNIAUTH_IMAGE is required}
    env_file:
      - path: ./.env
        format: raw
    environment:
      UNIAUTH_LISTEN_ADDR: :8080
      UNIAUTH_DATABASE_PATH: /data/uniauth.db
    ports:
      - "127.0.0.1:${UNIAUTH_HOST_PORT:?UNIAUTH_HOST_PORT is required}:8080"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
